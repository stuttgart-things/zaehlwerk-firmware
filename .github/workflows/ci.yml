# Lint, test and build. Called on its own for pushes and pull requests, and
# called by release.yml so that a tag cannot produce a binary these checks
# have not passed.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: tools/log-sink/go.sum

      - name: gofmt
        working-directory: tools/log-sink
        run: |
          # gofmt -l prints what it would change and exits 0 either way, so the
          # emptiness of its output is the test.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        working-directory: tools/log-sink
        run: go vet ./...

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: python syntax
        run: python -m compileall -q scripts

      - name: yaml parses
        run: |
          pip install --quiet pyyaml
          python -c "import yaml,sys; [yaml.safe_load(open(f)) for f in sys.argv[1:]]" Taskfile.yaml .github/workflows/ci.yml .github/workflows/release.yml mkdocs.yml catalog-info.yaml

      - name: no secrets committed
        run: |
          # secrets.ini is gitignored; this catches the day somebody forces it in.
          if git ls-files --error-unmatch secrets.ini >/dev/null 2>&1; then
            echo "::error::secrets.ini is tracked by git. It holds wifi and OTA passwords."
            exit 1
          fi

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/version.py runs `git describe --tags`, which needs the tags
          # and the history. A shallow clone stamps every build 0.0.0-dev.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: cache platformio
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: install platformio
        run: pip install --upgrade platformio

      - name: static analysis
        run: |
          # Install first, separately: anything PlatformIO prints while fetching a
          # package would otherwise land in the redirected JSON, or — as happened
          # on the first run — the JSON never gets written at all and the step
          # fails on an empty file with nothing to read.
          pio pkg install -e piezo
          # cppcheck explicitly: --skip-packages keeps the check scoped to our own
          # sources, and on a fresh runner that left the tool uninstalled, so the
          # check silently did nothing and wrote no JSON.
          pio pkg install -g --tool platformio/tool-cppcheck

          # Once for a human to read in the log.
          pio check -e piezo --skip-packages

          # And once for the gate. Cached, so its stdout is only JSON.
          pio check -e piezo --skip-packages --json-output > check.json
          if [ ! -s check.json ]; then
            echo "::error::pio check wrote no JSON — see the readable run above"
            exit 1
          fi

          # The gate is scripts/check-gate.py, not --fail-on-defect: that flag
          # reports HIGH 1 and exits 0 once check_flags is set, which was found
          # by injecting a null pointer dereference and watching it pass.
          python scripts/check-gate.py check.json --fail-on high medium

      - name: rule tests
        run: pio test -e native

      - name: build firmware and web ui
        run: |
          pio run -e piezo
          pio run -e piezo-test
          pio run -e piezo -t buildfs

      - name: artefacts hold no private credentials
        run: |
          # secrets.ini is never in a fresh checkout, so the build falls back to
          # the empty defaults in include/config.h. Assert that rather than trust
          # it: a release binary that carries somebody's wifi password is exactly
          # the mistake this step exists to prevent.
          if [ -f secrets.ini ]; then
            echo "::error::secrets.ini exists in CI. Built artefacts would contain credentials."
            exit 1
          fi
          python3 - <<'PY'
          import pathlib, re, sys
          hdr = pathlib.Path("include/config.h").read_text()

          # These must be empty, or a published binary carries somebody's network.
          for name in ("ZW_STA_PASS", "ZW_OTA_PASS", "ZW_STA_SSID"):
              m = re.search(rf'#define\s+{name}\s+"([^"]*)"', hdr)
              if m is None or m.group(1) != "":
                  sys.exit(f"{name} has a baked-in default: {m and m.group(1)!r}")

          # ZW_AP_PASS deliberately does have one: the fallback access point must
          # not come up open. It is in include/config.h for anyone to read, so it
          # is a published default and not a secret — say so rather than let the
          # step name imply the access point is protected by something private.
          ap = re.search(r'#define\s+ZW_AP_PASS\s+"([^"]*)"', hdr)
          print("no private credentials; OTA ships disabled")
          print(f"access point password is the published default from "
                f"include/config.h ({len(ap.group(1)) if ap else 0} characters)")
          PY

      - name: sizes
        run: |
          ls -l .pio/build/piezo/firmware.bin .pio/build/piezo/littlefs.bin
          pio run -e piezo -t size | grep -E 'Flash|RAM' || true

      - uses: actions/upload-artifact@v4
        with:
          name: piezo-build
          path: |
            .pio/build/piezo/firmware.bin
            .pio/build/piezo/littlefs.bin
          if-no-files-found: error
          retention-days: 14

  sink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: tools/log-sink/go.sum
      - name: test
        working-directory: tools/log-sink
        run: go test -race ./...
      - name: build
        working-directory: tools/log-sink
        run: go build ./...
