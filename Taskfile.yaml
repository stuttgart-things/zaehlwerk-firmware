---
# Task is the layer humans type at: every command someone runs is a task.
# PlatformIO still does the building — the tasks call `pio` and put around it
# what otherwise gets checked by hand every time: is a board plugged in, is
# something holding the serial port, is the laptop even on the right wifi.
#
# gum asks the questions. Anything touching a password is `silent: true`, so
# Task does not echo the command.
version: 3

vars:
  # The serial port is found, not guessed. Override with:
  #   PORT=/dev/cu.SLAB_USBtoUART task flash
  PORT:
    sh: ls /dev/cu.usbserial-* 2>/dev/null | head -1
  # curl gets -4 everywhere below. Resolving a .local name for AAAA can sit in a
  # timeout for five seconds before IPv4 is tried, which looks exactly like a
  # board that is not answering. With -4 the same request takes 0.1s.
  #
  # Where the board answers. Since #14 it joins the configured network and
  # answers to zaehlwerk.local; while it carries its own access point instead,
  # override it:  task ota ESP_HOST=192.168.4.1
  ESP_HOST: '{{.ESP_HOST | default "zaehlwerk.local"}}'
  # The board's own access point carries the chip id, so there is no default
  # worth guessing. `task boot` prints the name. Pass it, or be asked.
  AP_SSID: '{{.AP_SSID | default ""}}'
  WIFI_DEV: '{{.WIFI_DEV | default "en0"}}'
  # The python that has pyserial in it — PlatformIO's.
  PIO_PY: '{{.PIO_PY | default "$HOME/.platformio/penv/bin/python3"}}'

tasks:

  default:
    desc: What to type, in order, to get from nothing to a running board
    silent: true
    cmds:
      - |
        cat <<'EOF'
        From nothing to a running board:

          task setup      write secrets.ini (wifi and OTA passwords)
          task check      tools, board, network, passwords
          task flash      once, over USB
          task boot       reset and read the boot lines

        After that everything goes over the air, with the board on the
        configured network and answering to zaehlwerk.local:

          task ota        send new firmware over wifi
          task rollback   upload a deliberately broken build, watch it come back
          task board      ask it which network, address and channel it is on

        Everything else:

          task --list
        EOF

  ## ──────────────────────────────────────────────
  ## SETTING UP AND CHECKING
  ## ──────────────────────────────────────────────

  setup:
    desc: Write secrets.ini — wifi and OTA passwords, never in the repository
    silent: true
    cmds:
      - |
        set -e
        if [ -f secrets.ini ]; then
          gum confirm "secrets.ini already exists. Overwrite?" || exit 0
        fi
        sta=$(gum input --header "Wifi the board should join (empty: only its own access point)" --placeholder "SSID")
        stapass=""
        [ -z "$sta" ] || stapass=$(gum input --password --header "Password for $sta")
        ap=$(gum input --password --header "Password of the access point the board falls back to" --value "pingpong")
        ota=$(gum input --password --header "OTA password (empty means OTA stays off)")
        {
          printf '%s\n' '; Written by `task setup`. Not committed, see .gitignore.'
          printf '\n[secrets]\n'
          printf 'ota_pass = %s\n' "$ota"
          printf '\nbuild_flags =\n'
          printf "    -DZW_AP_PASS='\"%s\"'\n" "$ap"
          [ -z "$sta" ] || printf "    -DZW_STA_SSID='\"%s\"'\n" "$sta"
          [ -z "$sta" ] || printf "    -DZW_STA_PASS='\"%s\"'\n" "$stapass"
        } > secrets.ini
        gum log --level info "secrets.ini written"
        if [ -z "$ota" ]; then
          gum log --level warn "With no OTA password there is no update path over the air."
        fi
        gum log --level warn "These are compiled in. Changing one means one more USB flash."
        [ -z "$sta" ] || gum log --level info "The wifi only seeds the first connection; after that the web UI writes it to NVS."

  status:
    desc: Where everything stands — board, laptop, sink, mode
    silent: true
    cmds:
      - |
        # Not the same question as `task check`. That one asks whether anything
        # is in the way before you start; this one answers "what am I looking
        # at", which is what somebody asks after a break, a move or a reflash.
        gum style --border rounded --padding "0 1" --border-foreground 212 "zaehlwerk"

        laptop=$(ifconfig {{.WIFI_DEV}} 2>/dev/null | awk '/inet /{print $2}' | head -1)
        sink_pid=$(pgrep -f 'log-sink' | head -1)

        curl -4 -sf -m 5 "http://{{.ESP_HOST}}/version" > /tmp/zw-st-v 2>/dev/null || :
        curl -4 -sf -m 5 "http://{{.ESP_HOST}}/state"   > /tmp/zw-st-s 2>/dev/null || :
        curl -4 -sf -m 5 "http://{{.ESP_HOST}}/diag"    > /tmp/zw-st-d 2>/dev/null || :
        curl -4 -sf -m 5 "http://{{.ESP_HOST}}/net"     > /tmp/zw-st-n 2>/dev/null || :

        LAPTOP="$laptop" SINKPID="$sink_pid" HOST="{{.ESP_HOST}}" python3 - <<'PYEOF'
        import json, os, sys

        def load(p):
            try:
                with open(p) as f:
                    return json.load(f)
            except Exception:
                return None

        v, st, dg, nt = (load("/tmp/zw-st-" + k) for k in ("v", "s", "d", "n"))
        laptop = os.environ.get("LAPTOP") or "no address"
        host = os.environ["HOST"]

        if not v:
            print("  Board    %s does not answer" % host)
            print("           on the same network? a reset takes 15s to fall back")
            print("           'task boot' reads it over the cable")
        else:
            ip = (nt or {}).get("ip", "?")
            dirty = "  DIRTY" if v.get("dirty") else ""
            print("  Board    %-16s git %s   built %s%s"
                  % (ip, v.get("git", "?"), v.get("built", "?"), dirty))
            if nt:
                where = ('wifi "%s"' % nt.get("ssid") if nt.get("mode") == "station"
                         else 'own access point "%s"' % nt.get("ssid"))
                print("           %s, channel %s, %s" % (where, nt.get("ch"), nt.get("host")))

        # Same network matters more than the addresses themselves: it is what
        # decides whether an upload or the log can reach anywhere.
        same = ""
        bip = (nt or {}).get("ip")
        if bip and laptop.count(".") == 3:
            same = ("same network" if bip.rsplit(".", 1)[0] == laptop.rsplit(".", 1)[0]
                    else "DIFFERENT network from the board")
        print("  Laptop   %-16s %s" % (laptop, same))

        if dg:
            if not dg.get("on"):
                sink = "logging off — nothing is being recorded"
            elif dg.get("alive"):
                sink = "%s:%s answers" % (dg.get("host"), dg.get("port"))
            elif dg.get("held"):
                sink = "%s:%s does not answer — %s events held for it" % (
                    dg.get("host"), dg.get("port"), dg["held"])
            else:
                # Nothing held yet is not the same as nothing being kept.
                sink = "%s:%s does not answer — anything scored now is held" % (
                    dg.get("host"), dg.get("port"))
            if dg.get("held") and dg.get("alive"):
                sink += ", %s still queued" % dg["held"]
            if dg.get("dropped"):
                sink += ", %s dropped" % dg["dropped"]
            print("  Log      %s" % sink)
            print("           session %s" % dg.get("session"))
        print("  Sink     %s" % ("running here, pid " + os.environ["SINKPID"]
                                 if os.environ.get("SINKPID") else "not running here"))

        if st:
            mode = "mock" if st.get("mock") else "real game"
            sim = ["", "autoplay", "one game", "one match"][st.get("sim", 0)]
            if sim and st.get("pause"):
                sim += " (paused)"
            names = "%s vs %s" % (st.get("na"), st.get("nb")) if st.get("named") else "A vs B"
            print("  Play     %s, %s, %d:%d, set %s%s"
                  % (mode, names, st.get("a", 0), st.get("b", 0), st.get("satz", "?"),
                     ", simulating " + sim if sim else ""))
        PYEOF
        rm -f /tmp/zw-st-v /tmp/zw-st-s /tmp/zw-st-d /tmp/zw-st-n

  check:
    desc: Whether anything is in the way — tools, board, network, passwords
    silent: true
    cmds:
      - |
        failures=0
        expect() {  # name, command
          if eval "$2" >/dev/null 2>&1; then gum log --level info "$1"
          else gum log --level error "$1"; failures=$((failures+1)); fi
        }

        gum style --border rounded --padding "0 1" --border-foreground 212 "zaehlwerk-firmware"

        expect "pio is on the PATH"  "command -v pio"
        expect "gum is on the PATH"  "command -v gum"

        if [ -n "{{.PORT}}" ]; then
          gum log --level info "Board on {{.PORT}}"
          if lsof "{{.PORT}}" >/dev/null 2>&1; then
            gum log --level warn "Something holds the port — an open monitor blocks a USB upload."
          fi
        else
          gum log --level warn "No board on USB (only flash and boot need one)"
        fi

        if [ -f secrets.ini ]; then
          ota=$(sed -nE 's/^[[:space:]]*ota_pass[[:space:]]*=[[:space:]]*(.*)$/\1/p' secrets.ini | tr -d ' ')
          if [ -z "$ota" ]; then
            gum log --level warn "secrets.ini is there but ota_pass is empty — OTA is off"
          elif [ "$ota" = "bitte-aendern" ]; then
            gum log --level warn "ota_pass is still the placeholder"
          else
            gum log --level info "ota_pass is set"
          fi
        else
          gum log --level error "secrets.ini is missing — run 'task setup'"
          failures=$((failures+1))
        fi

        if curl -4 -sf -m 5 "http://{{.ESP_HOST}}/version" >/dev/null 2>&1; then
          gum log --level info "Board answers at {{.ESP_HOST}} — OTA can go ahead"
        elif ifconfig {{.WIFI_DEV}} 2>/dev/null | grep -q 'inet 192\.168\.4\.'; then
          gum log --level warn "On the board's own wifi but {{.ESP_HOST}} does not resolve — try ESP_HOST=192.168.4.1"
        else
          gum log --level warn "{{.ESP_HOST}} does not answer — is the board up, and on the same network?"
        fi

        branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null)
        if git diff --quiet 2>/dev/null; then
          gum log --level info "git: $branch, clean"
        else
          gum log --level warn "git: $branch, modified — builds carry -dirty in the version"
        fi

        [ "$failures" -eq 0 ] && gum log --level info "Nothing in the way." || exit 1

  ## ──────────────────────────────────────────────
  ## BUILDING AND TESTING
  ## ──────────────────────────────────────────────

  build:
    desc: Build piezo and piezo-test
    cmds:
      - pio run

  test:
    desc: Run the rule tests on the laptop
    cmds:
      - pio test -e native

  verify:
    desc: Build and test — what has to be green before a commit
    cmds:
      - task: build
      - task: test
      - task: sink:test

  ## ──────────────────────────────────────────────
  ## THE LOG SINK
  ## ──────────────────────────────────────────────

  sink:
    desc: Receive the diagnostic log and serve the viewer
    dir: tools/log-sink
    silent: true
    cmds:
      - |
        gum log --level info "Point the board here: http://{{.ESP_HOST}}/ under Diagnose,"
        gum log --level info "or curl 'http://{{.ESP_HOST}}/diag?host=<this laptop>&port=9000&on=1'"
        go run . -dir ../../{{.SINK_DIR | default "sink-data"}}

  sink:mock:
    desc: Send a made-up session at the sink — no board needed
    dir: tools/log-sink
    cmds:
      - go run . mock -to {{.TO | default "127.0.0.1:9000"}} -rallies {{.RALLIES | default 8}} -loss {{.LOSS | default 0}} -wrong {{.WRONG | default 0.15}} -corrections {{.CORRECTIONS | default 0.3}}

  sink:test:
    desc: Tests for the sink
    dir: tools/log-sink
    cmds:
      - go test ./...

  sink:games:
    desc: Split a session into one JSON per game — SESSION=…/sessions/<file>.jsonl
    dir: tools/log-sink
    silent: true
    cmds:
      - |
        [ -n "{{.SESSION}}" ] || {
          gum log --level error "Which session? task sink:games SESSION=path/to.jsonl"
          exit 1
        }
        go run . games {{if .SAMPLES}}-samples{{end}} "../../{{.SESSION}}"

  sink:export:
    desc: Zip one session with a summary — SESSION=sessions/<file>.jsonl
    dir: tools/log-sink
    silent: true
    cmds:
      - |
        [ -n "{{.SESSION}}" ] || {
          gum log --level error "Which session? task sink:export SESSION=path/to.jsonl"
          exit 1
        }
        go run . export "../../{{.SESSION}}"

  ## ──────────────────────────────────────────────
  ## ONTO THE BOARD
  ## ──────────────────────────────────────────────

  flash:
    desc: The first flash, over USB — once, everything after that is over the air
    silent: true
    cmds:
      - |
        set -e
        [ -n "{{.PORT}}" ] || { gum log --level error "No board on USB."; exit 1; }
        if lsof "{{.PORT}}" >/dev/null 2>&1; then
          gum log --level error "The port is busy. An open monitor blocks the upload — close it first."
          exit 1
        fi
        gum confirm "Write firmware over USB to {{.PORT}}? This overwrites what is on it." || exit 0
        pio run -e piezo -t upload

  monitor:
    desc: Serial monitor, 115200
    cmds:
      - pio device monitor

  boot:
    desc: Reset the board and read the boot lines — slot and image state
    silent: true
    cmds:
      - |
        [ -n "{{.PORT}}" ] || { gum log --level error "No board on USB."; exit 1; }
        if lsof "{{.PORT}}" >/dev/null 2>&1; then
          gum log --level error "The port is busy — close the monitor first."
          exit 1
        fi
        {{.PIO_PY}} scripts/boot-log.py "{{.PORT}}" "{{.DURATION | default 14}}"

  board:
    desc: Ask a running board over HTTP what it is
    silent: true
    cmds:
      - |
        if ! curl -4 -sf -m 5 "http://{{.ESP_HOST}}/version" >/dev/null 2>&1; then
          gum log --level warn "{{.ESP_HOST}} does not answer — is the board up and on the same network?"
          gum log --level info "The serial line works too: 'task boot'"
          exit 1
        fi
        echo "Version: $(curl -4 -s -m 5 http://{{.ESP_HOST}}/version)"
        echo "Network: $(curl -4 -s -m 5 http://{{.ESP_HOST}}/net)"
        echo "State:   $(curl -4 -s -m 5 http://{{.ESP_HOST}}/state)"

  ## ──────────────────────────────────────────────
  ## OVER THE AIR
  ## ──────────────────────────────────────────────

  ota:
    desc: Send new firmware over wifi
    silent: true
    cmds:
      - task: net:ensure
      - |
        gum log --level info "The first upload makes macOS ask whether python may accept connections — say yes."
        pio run -e piezo-ota -t upload --upload-port "{{.ESP_HOST}}"

  rollback:
    desc: Upload a deliberately broken build and watch the previous one come back
    silent: true
    cmds:
      - task: net:ensure
      - |
        set -e
        cat <<'EOF'

        What is about to happen:

          1. A build with -DOTA_TEST_CRASH goes over the air into the free slot.
          2. It starts, runs for three seconds and crashes on purpose.
          3. The bootloader brings the previous one back, with no hand on the board.

        The crash only fires on an image that is on probation, so the board
        cannot end up stuck in a boot loop.

        EOF
        gum confirm "Go ahead?" || exit 0

        # Listen, do not reset — and start now, not after the upload. The board
        # restarts by itself once the image is written, crashes three seconds
        # later and is rolled back; anyone triggering their own reset after that
        # sees only the outcome.
        log=$(mktemp)
        if [ -n "{{.PORT}}" ] && ! lsof "{{.PORT}}" >/dev/null 2>&1; then
          {{.PIO_PY}} scripts/boot-log.py "{{.PORT}}" 60 --listen > "$log" 2>&1 &
          listener=$!
        else
          gum log --level warn "No free serial port — the sequence will go unseen."
          listener=""
        fi

        pio run -e piezo-ota-crash -t upload --upload-port "{{.ESP_HOST}}" || true

        if [ -n "$listener" ]; then
          gum log --level info "Uploaded. Waiting for the crash and the rollback ..."
          wait "$listener" || true
          echo
          cat "$log"
        fi
        rm -f "$log"

  ## ──────────────────────────────────────────────
  ## WIFI
  ## ──────────────────────────────────────────────

  net:ensure:
    desc: Make sure the board is reachable before an upload
    internal: true
    silent: true
    cmds:
      - |
        curl -4 -sf -m 5 "http://{{.ESP_HOST}}/version" >/dev/null 2>&1 && exit 0
        gum log --level warn "{{.ESP_HOST}} does not answer — the upload would go nowhere."
        gum log --level info "Since #14 the board joins the configured network. If it fell back to"
        gum log --level info "its own access point, the laptop has to join that instead."
        gum confirm "Join the board's own access point?" || exit 1
        task wifi:esp
        curl -4 -sf -m 5 "http://192.168.4.1/version" >/dev/null 2>&1 \
          || { gum log --level error "Still nothing at 192.168.4.1. Is it running? 'task boot'"; exit 1; }
        gum log --level warn "Reachable at 192.168.4.1 — rerun with ESP_HOST=192.168.4.1"
        exit 1

  wifi:esp:
    desc: Join the access point the board carries (its name holds the chip id)
    silent: true
    cmds:
      - |
        set -e
        ssid="{{.AP_SSID}}"
        if [ -z "$ssid" ]; then
          gum log --level info "The name is on the boot line: 'Zaehlwerk-<chip id>'. 'task boot' prints it."
          ssid=$(gum input --header "Name of the board's access point" --placeholder "Zaehlwerk-c4e32c")
        fi
        [ -n "$ssid" ] || { gum log --level error "No name, nothing to join."; exit 1; }
        pass=$(sed -nE "s/.*-DZW_AP_PASS='\"(.*)\"'.*/\1/p" secrets.ini 2>/dev/null | head -1)
        [ -n "$pass" ] || pass=$(gum input --password --header "Password for $ssid")
        networksetup -setairportnetwork {{.WIFI_DEV}} "$ssid" "$pass" >/dev/null 2>&1 || true
        for i in $(seq 1 20); do
          if ifconfig {{.WIFI_DEV}} 2>/dev/null | grep -q 'inet 192\.168\.4\.'; then
            gum log --level info "Connected: $(ifconfig {{.WIFI_DEV}} | awk '/inet /{print $2}' | head -1)"
            exit 0
          fi
          sleep 1
        done
        gum log --level error "No address in 192.168.4.x. Is the board running? 'task boot'"
        exit 1

  wifi:back:
    desc: Rejoin the usual wifi
    silent: true
    cmds:
      - |
        networksetup -setairportpower {{.WIFI_DEV}} off
        sleep 2
        networksetup -setairportpower {{.WIFI_DEV}} on
        gum log --level info "Wifi restarted — macOS picks the preferred network."

  ## ──────────────────────────────────────────────
  ## DOCUMENTATION
  ## ──────────────────────────────────────────────

  docs:serve:
    desc: Preview the TechDocs the way Backstage renders them
    silent: true
    cmds:
      - |
        command -v mkdocs >/dev/null 2>&1 || {
          gum log --level error "mkdocs is missing: pipx install mkdocs-techdocs-core"
          exit 1
        }
        mkdocs serve
