; Zählwerk Firmware — PlatformIO
;
; Die Sketches unter sketches/ bleiben als Historie liegen; gebaut und
; geflasht wird ab hier ausschließlich über PlatformIO.
;
; Lokale Geheimnisse (WLAN-Zugangsdaten, OTA-Passwort) stehen in secrets.ini.
; Die Datei ist nicht eingecheckt — einmal anlegen mit:
;
;     cp secrets.ini.example secrets.ini
;
; Fehlt sie, baut das Projekt trotzdem und nimmt die Vorgaben aus
; include/config.h.

[platformio]
extra_configs = secrets.ini

; Platzhalter für secrets.ini. Steht dort ein gleichnamiger Abschnitt, gewinnt
; er — hier bleibt die Liste leer, damit das Projekt auch ohne Zugangsdaten baut.
[secrets]
build_flags =

; Gilt für jede Umgebung, also auch für die Tests auf dem Laptop. Hier steht
; deshalb nichts, was einen ESP32 voraussetzt.
[env]
build_flags =
    -std=gnu++17
    -Wall

; Gemeinsame Basis der beiden ESP32-Umgebungen.
;
; default.csv ist das Standardschema mit zwei App-Slots (ota_0/ota_1) und einem
; Dateisystem dahinter. Zwei Slots sind die Voraussetzung dafür, dass OTA und
; das Zurückrollen einer kaputten Firmware überhaupt möglich sind — das Schema
; deshalb nicht gegen ein einslotiges tauschen.
[esp32_base]
platform = espressif32@6.5.0
framework = arduino
board = esp32dev
board_build.partitions = default.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    ${secrets.build_flags}
; Der Stufe-2-Sketch kommt mit WiFi.h und WebServer.h aus. Beides steckt im
; ESP32-Arduino-Core, deshalb steht hier noch keine externe Bibliothek.
lib_deps =

; ---------------------------------------------------------------------------
; piezo — Produktivstand auf der Platte. Startet im echten Spiel.
; ---------------------------------------------------------------------------
[env:piezo]
extends = esp32_base

; ---------------------------------------------------------------------------
; piezo-test — derselbe Code, startet aber im Mock-Modus, damit ohne Piezo am
; Schreibtisch getestet werden kann. Das Flag wirkt erst mit dem Mock-Sensor;
; bis dahin baut die Umgebung identisch zu piezo.
; ---------------------------------------------------------------------------
[env:piezo-test]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DDEFAULT_MOCK

; ---------------------------------------------------------------------------
; native — Unity-Tests der plattformunabhängigen Logik auf dem Laptop.
; Kein ESP32, kein Arduino-Framework.
; ---------------------------------------------------------------------------
[env:native]
platform = native@1.2.1
test_framework = unity
