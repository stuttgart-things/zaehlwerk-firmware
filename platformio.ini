;  Zählwerk firmware — PlatformIO
;
; The sketches under sketches/ stay as the record; from here it is built and
; flashed with PlatformIO only.
;
; Local secrets (wifi credentials, the OTA password) live in secrets.ini, which
; is not committed. Write it once with `task setup`, or by hand:
;
;     cp secrets.ini.example secrets.ini
;
; Without it the project still builds and takes the defaults from
; include/config.h.

[platformio]
extra_configs = secrets.ini
; What a bare `pio run` and the extension's build button build. piezo-ota and
; piezo-ota-crash are upload paths and produce the same binary; native is a
; test-only environment with no program to build.
default_envs = piezo, piezo-test

; A placeholder for secrets.ini. A section of the same name there wins; here the
; list stays empty so the project builds with no credentials at all.
[secrets]
; One place for the OTA password, two uses: a build flag for the firmware and
; --auth for espota. Empty means OTA stays off.
ota_pass =
build_flags =

; Applies to every environment, the laptop tests included. Nothing here may
; assume an ESP32.
[env]
check_tool = cppcheck
check_flags =
  cppcheck: --enable=all --inline-suppr
  ; No path-scoped suppressions here: PlatformIO reads the path as a component
  ; of its own and then miscounts, which silently turns --fail-on-defect off.
  ; Every public function in a library is "unused" from inside the library.
  cppcheck: --suppress=unusedFunction
  cppcheck: --suppress=missingIncludeSystem
build_flags =
    -std=gnu++17
    -Wall

; The shared base of the two ESP32 environments.
;
; default.csv is the standard table with two app slots (labelled app0 and app1,
; of subtype ota_0/ota_1) and a filesystem behind them. Two slots are what makes
; an over-the-air update and a rollback possible at all — do not swap it for a
; single-slot table.
[esp32_base]
platform = espressif32@6.5.0
framework = arduino
board = esp32dev
board_build.partitions = default.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; Bakes the version and the git hash in as build flags. See include/version.h.
extra_scripts = pre:scripts/version.py
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    ${secrets.build_flags}
    -DZW_OTA_PASS='"${secrets.ota_pass}"'
; The stage 2 sketch gets by with WiFi.h and WebServer.h, both of which are in
; the ESP32 Arduino core — hence no external library here yet.
lib_deps =

; ---------------------------------------------------------------------------
; piezo — what runs on the table. Starts in real-game mode.
; ---------------------------------------------------------------------------
[env:piezo]
extends = esp32_base

; ---------------------------------------------------------------------------
; piezo-test — the same code, but starting in mock mode so it can be worked on
; at a desk with no piezo. The flag does nothing until the mock sensor exists;
; until then this environment builds identically to piezo.
; ---------------------------------------------------------------------------
[env:piezo-test]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DDEFAULT_MOCK

; ---------------------------------------------------------------------------
; piezo-ota — the same program, sent over the network instead of over USB.
; Flash `piezo` over USB once; after that this is the way.
;
; upload_port is where the board answers. zaehlwerk.local resolves over Bonjour
; once the board has joined a router, which is the normal case since #14. While
; it carries its own access point, override it:
;
;     task ota ESP_HOST=192.168.4.1
;
; host_port is fixed so a firewall rule for it keeps working.
; ---------------------------------------------------------------------------
[env:piezo-ota]
extends = env:piezo
upload_protocol = espota
upload_port = zaehlwerk.local
upload_flags =
    --port=3232
    --host_port=45678
    --auth=${secrets.ota_pass}

; ---------------------------------------------------------------------------
; piezo-ota-crash — the same OTA path, but the firmware crashes on purpose
; three seconds after starting. That makes the rollback something to watch
; rather than believe: upload it and see the bootloader fetch the previous build.
;
; Send this over OTA only. The crash fires solely on an image that is on
; probation, so a build carrying the flag that was written over USB runs
; normally instead of hanging in a boot loop.
; ---------------------------------------------------------------------------
[env:piezo-ota-crash]
extends = env:piezo-ota
build_flags =
    ${esp32_base.build_flags}
    -DOTA_TEST_CRASH

; ---------------------------------------------------------------------------
; native — Unity tests of the platform-independent logic, on the laptop.
; No ESP32, no Arduino framework.
; ---------------------------------------------------------------------------
[env:native]
platform = native@1.2.1
test_framework = unity
; The firmware source is worth nothing on a laptop — what is checked is lib/.
; Without this filter a bare `pio run` tries to compile src/main.cpp with
; Arduino.h and fails. Test builds do not pull in src/ anyway, which is why it
; went unnoticed.
build_src_filter = -<*>
