; Zählwerk Firmware — PlatformIO
;
; Die Sketches unter sketches/ bleiben als Historie liegen; gebaut und
; geflasht wird ab hier ausschließlich über PlatformIO.
;
; Lokale Geheimnisse (WLAN-Zugangsdaten, OTA-Passwort) stehen in secrets.ini.
; Die Datei ist nicht eingecheckt — einmal anlegen mit:
;
;     cp secrets.ini.example secrets.ini
;
; Fehlt sie, baut das Projekt trotzdem und nimmt die Vorgaben aus
; include/config.h.

[platformio]
extra_configs = secrets.ini
; Was ein blankes `pio run` und der Build-Knopf der IDE-Erweiterung bauen.
; piezo-ota und piezo-ota-crash sind Einspielwege und bauen dasselbe; native
; ist eine reine Testumgebung und hat kein Programm, das sich bauen liesse.
default_envs = piezo, piezo-test

; Platzhalter für secrets.ini. Steht dort ein gleichnamiger Abschnitt, gewinnt
; er — hier bleibt die Liste leer, damit das Projekt auch ohne Zugangsdaten baut.
[secrets]
; Ein Ort für das OTA-Passwort, zwei Verwendungen: als Build-Flag für die
; Firmware und als --auth für espota. Leer heißt, OTA bleibt aus.
ota_pass =
build_flags =

; Gilt für jede Umgebung, also auch für die Tests auf dem Laptop. Hier steht
; deshalb nichts, was einen ESP32 voraussetzt.
[env]
build_flags =
    -std=gnu++17
    -Wall

; Gemeinsame Basis der beiden ESP32-Umgebungen.
;
; default.csv ist das Standardschema mit zwei App-Slots (ota_0/ota_1) und einem
; Dateisystem dahinter. Zwei Slots sind die Voraussetzung dafür, dass OTA und
; das Zurückrollen einer kaputten Firmware überhaupt möglich sind — das Schema
; deshalb nicht gegen ein einslotiges tauschen.
[esp32_base]
platform = espressif32@6.5.0
framework = arduino
board = esp32dev
board_build.partitions = default.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; Backt Version und Git-Hash als Build-Flags ein. Siehe include/version.h.
extra_scripts = pre:scripts/version.py
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    ${secrets.build_flags}
    -DZW_OTA_PASS='"${secrets.ota_pass}"'
; Der Stufe-2-Sketch kommt mit WiFi.h und WebServer.h aus. Beides steckt im
; ESP32-Arduino-Core, deshalb steht hier noch keine externe Bibliothek.
lib_deps =

; ---------------------------------------------------------------------------
; piezo — Produktivstand auf der Platte. Startet im echten Spiel.
; ---------------------------------------------------------------------------
[env:piezo]
extends = esp32_base

; ---------------------------------------------------------------------------
; piezo-test — derselbe Code, startet aber im Mock-Modus, damit ohne Piezo am
; Schreibtisch getestet werden kann. Das Flag wirkt erst mit dem Mock-Sensor;
; bis dahin baut die Umgebung identisch zu piezo.
; ---------------------------------------------------------------------------
[env:piezo-test]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DDEFAULT_MOCK

; ---------------------------------------------------------------------------
; piezo-ota — dasselbe Programm, aber über das Netz eingespielt statt über USB.
; Einmal per USB mit `piezo` flashen, danach ist das hier der Weg.
;
; upload_port ist die Adresse des Geräts: 192.168.4.1, solange der ESP seinen
; eigenen Accesspoint aufspannt, später zaehlwerk.local oder die IP im WLAN.
; host_port ist fest, damit eine Firewall-Regel dafür dauerhaft passt.
; ---------------------------------------------------------------------------
[env:piezo-ota]
extends = env:piezo
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --port=3232
    --host_port=45678
    --auth=${secrets.ota_pass}

; ---------------------------------------------------------------------------
; piezo-ota-crash — derselbe OTA-Weg, aber die Firmware stürzt drei Sekunden
; nach dem Start mit Absicht ab. Damit lässt sich der Rollback prüfen, statt
; ihn zu glauben: einspielen, zusehen wie der Bootloader den vorigen Stand
; zurückholt.
;
; Nur über OTA einspielen. Der Absturz greift ausschließlich auf einem Image,
; das auf Probe läuft — ein per USB geflashter Build mit diesem Flag läuft
; deshalb normal weiter statt in einer Startschleife zu hängen.
; ---------------------------------------------------------------------------
[env:piezo-ota-crash]
extends = env:piezo-ota
build_flags =
    ${esp32_base.build_flags}
    -DOTA_TEST_CRASH

; ---------------------------------------------------------------------------
; native — Unity-Tests der plattformunabhängigen Logik auf dem Laptop.
; Kein ESP32, kein Arduino-Framework.
; ---------------------------------------------------------------------------
[env:native]
platform = native@1.2.1
test_framework = unity
; Die Firmware-Quelle ist auf dem Laptop nichts wert — geprüft wird lib/.
; Ohne diesen Filter versucht `pio run` (ohne -e) src/main.cpp mit Arduino.h
; zu übersetzen und bricht ab. Testbuilds ziehen src/ ohnehin nicht herein,
; deshalb fiel es bisher nicht auf.
build_src_filter = -<*>
